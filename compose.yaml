# docker compose up                     web on :3000 (PORT=3100 to publish elsewhere), two workers
# docker compose up --scale worker=3    or set WORKER_REPLICAS
# docker compose run --rm migrate npx prisma db seed    load the sample intakes
#
# A new migration needs `docker compose down` first: Prisma can't migrate a SQLite file that's open.
# Without a .env the worker uses the mock AI provider; set AI_PROVIDER=openai and OPENAI_API_KEY for the real one.

x-app: &app
  build:
    context: .
    target: runner
  image: project-triage:local
  volumes:
    - ./data:/app/data
  depends_on:
    migrate:
      condition: service_completed_successfully

x-database: &database
  DATABASE_URL: file:/app/data/dev.db

services:
  migrate:
    build:
      context: .
      target: migrate
    image: project-triage-migrate:local
    environment:
      <<: *database
    volumes:
      - ./data:/app/data
    restart: "no"

  web:
    <<: *app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      <<: *database
    # Open SSE streams never finish, and web holds no leases, so don't wait long for them.
    stop_grace_period: 3s
    restart: unless-stopped

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    environment:
      <<: *database
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      FORCE_AI_FAILURE: ${FORCE_AI_FAILURE:-}
      # Defaults mirror the code's, because its config schema rejects an empty string.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-500}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-60000}
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-15000}
      WORKER_DRAIN_MS: ${WORKER_DRAIN_MS:-10000}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    # Keep above WORKER_DRAIN_MS, or SIGKILL lands before leases are handed back.
    stop_grace_period: 20s
    restart: unless-stopped
